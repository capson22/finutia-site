<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0d0d14">
    <title>Page not found | Finutia AI</title>
    <style>
      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; background: #0d0d14; color: #f2f0f7; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.65; }
      .draft { padding: .52rem 1rem; border-bottom: 1px solid rgb(245 158 11 / 32%); background: rgb(245 158 11 / 10%); color: #ffd98a; font-size: .875rem; font-weight: 650; text-align: center; }
      main { width: min(calc(100% - 2rem), 48rem); min-height: calc(100vh - 3rem); margin: 0 auto; padding: clamp(4rem, 9vw, 8rem) 0; }
      p { color: #a9a4b8; }
      .eyebrow { color: #9fe9f3; font-size: .78rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      h1 { max-width: 15ch; margin: 0 0 1.5rem; font-size: clamp(2.7rem, 7vw, 4.8rem); line-height: 1.08; letter-spacing: -.052em; }
      a { display: inline-flex; min-height: 3rem; margin-top: 1rem; padding: .72rem 1.15rem; align-items: center; border-radius: .8rem; background: linear-gradient(135deg, #7c3aed, #5b21b6); color: white; font-weight: 720; text-decoration: none; }
      a:focus-visible { outline: 3px solid rgb(6 182 212 / 72%); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div class="draft" role="note">Draft preview — website copy is awaiting approval.</div>
    <main>
      <p class="eyebrow">404</p>
      <h1>That page is not here.</h1>
      <p>The address may have changed, or the page may not exist yet.</p>
      <a id="home-link" href="/">Go to the Finutia home page</a>
    </main>
    <script>
      if (location.hostname.endsWith(".github.io")) {
        document.getElementById("home-link").href = "/finutia-site/";
      }
    </script>
  </body>
</html>
